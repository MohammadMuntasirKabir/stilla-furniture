name: Deploy to Railway

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: railway-deploy
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP lint (theme)
        run: |
          docker run --rm -v "$PWD/themes/stilla:/app" php:8.3-cli-alpine sh -c '
            for f in $(find /app -name "*.php"); do
              php -l "$f" >/dev/null || exit 1
            done
            echo "PHP lint OK"'
      - name: Validate Docker build
        run: docker build -t stilla-ci:test .

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Railway CLI
        run: npm install -g @railway/cli
      - name: Deploy to Railway
        run: railway up --service "${{ vars.RAILWAY_SERVICE || 'stilla' }}" --detach --yes
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
